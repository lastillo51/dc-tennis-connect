<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta
        name="description"
        content="Discover tennis courts in Washington, D.C. with DC Tennis Connect."
    >

    <title>{{ page_title }} | DC Tennis Connect</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='/css/styles.css') }}"
    >
</head>

<body>
    <a class="skip-link" href="#main-content">
        Skip to main content
    </a>
    <header class="site-header">
        <div class="container header-content">
            <a class="brand" href="/web">
                DC Tennis Connect
            </a>
            <nav aria-label="Main navigation">
                <a
                    href="/web"
                    {% if request.url.path == "/web" %}
                    aria-current="page"
                    {% endif %}
                >
                    Home
                </a>

                <a
                    href="/web/courts"
                    {% if request.url.path == "/web/courts" %}
                    aria-current="page"
                    {% endif %}
                >
                    Courts
                </a>
            </nav>
        </div>
    </header>

    <main id="main-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>
                DC Tennis Connect — Washington, D.C.
            </p>
            <p>
                Court information does not guarantee physical availability.
            </p>
        </div>
    </footer>
</body>
</html>
