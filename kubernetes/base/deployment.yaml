apiVersion: apps/v1
kind: Deployment

metadata:
  name: dc-tennis-api
  labels:
    app: dc-tennis-api

spec:
  replicas: 1

  selector:
    matchLabels:
      app: dc-tennis-api

  template:
    metadata:
      labels:
        app: dc-tennis-api

    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: api
          image: dc-tennis-connect:k8s-v1
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8000

          envFrom:
            - configMapRef:
                name: dc-tennis-config

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"